<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sener – Línea 5 FMB</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f0f0f2;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Trebuchet MS',Trebuchet,sans-serif;}
  .grid-bg{position:absolute;inset:0;overflow:hidden;z-index:1;}
  .grid-bg::before{content:'';position:absolute;inset:-50%;
    background-image:linear-gradient(rgba(150,150,160,0.18) 1px,transparent 1px),linear-gradient(90deg,rgba(150,150,160,0.18) 1px,transparent 1px);
    background-size:50px 50px;animation:gridmove 12s linear infinite;}
  @keyframes gridmove{from{transform:translate(0,0);}to{transform:translate(50px,50px);}}
  .halo{position:absolute;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,38,100,0.10) 0%,transparent 70%);
    top:38%;left:50%;transform:translate(-50%,-50%);
    animation:gpulse 3s ease-in-out infinite;z-index:2;}
  @keyframes gpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5;}50%{transform:translate(-50%,-50%) scale(1.25);opacity:1;}}
  #pc{position:absolute;inset:0;z-index:3;}
</style>
</head>
<body>
<div style="width:1280px;height:720px;position:relative;overflow:hidden;">
  <div class="grid-bg"></div>
  <div class="halo"></div>
  <canvas id="pc" width="1280" height="720"></canvas>

<script>
(function(){
  var canvas=document.getElementById('pc');
  var ctx=canvas.getContext('2d');
  var W=1280,H=720;
  var N=6000;
  var CX=W/2, CY=H*0.30, R=130;

  // 3D coords para la esfera
  var s3x=new Float32Array(N),s3y=new Float32Array(N),s3z=new Float32Array(N);
  // 2D targets logo
  var lx=new Float32Array(N),ly=new Float32Array(N);
  // posiciones actuales 2D
  var px=new Float32Array(N),py=new Float32Array(N);
  // posiciones morph from
  var fx=new Float32Array(N),fy=new Float32Array(N);

  // Colores
  var pcolor=[];
  var lcolor=new Array(N);

  // Generar esfera: solo capa externa (entre 75% y 100% del radio)
  for(var i=0;i<N;i++){
    var u=Math.random(),v=Math.random();
    var phi=Math.acos(2*v-1);
    var theta=2*Math.PI*u;
    var r=R*(0.9125+Math.random()*0.0875);
    s3x[i]=r*Math.sin(phi)*Math.cos(theta)+(Math.random()-.5)*4;
    s3y[i]=r*Math.sin(phi)*Math.sin(theta)+(Math.random()-.5)*4;
    s3z[i]=r*Math.cos(phi)+(Math.random()-.5)*4;
    var d=(s3z[i]/R+1)/2; // profundidad: 0 (atrás) → 1 (delante)
    var alpha=(0.35+d*0.5).toFixed(2);
    // Mezcla de colores: azul Sener + gris ETS + rojo ETS
    var roll=Math.random();
    var col;
    if(roll<0.45){
      // Azul Sener
      col='rgba(20,42,120,'+alpha+')';
    } else if(roll<0.72){
      // Gris ETS
      col='rgba(115,115,120,'+alpha+')';
    } else {
      // Rojo ETS
      col='rgba(220,55,55,'+alpha+')';
    }
    pcolor.push(col);
    // init posicion
    px[i]=CX+s3x[i];
    py[i]=CY+s3y[i];
  }

  // Scatter logo targets - DUAL: Sener (izquierda) + ETS (derecha)
  var logoLoaded=false;
  var loaded={sener:false,ets:false};
  function tryReady(){if(loaded.sener&&loaded.ets)logoLoaded=true;}

  function placeTargets(rangeStart,rangeEnd,image,region,defaultColor){
    var tc=document.createElement('canvas');
    var aspect=image.naturalHeight/image.naturalWidth;
    var tw=Math.max(300,Math.round(region.w*2.2));
    var th=Math.max(60,Math.round(tw*aspect));
    tc.width=tw;tc.height=th;
    var tctx=tc.getContext('2d');
    tctx.drawImage(image,0,0,tw,th);
    var dt=tctx.getImageData(0,0,tw,th).data;
    var pts=[];
    for(var i=0;i<dt.length;i+=4){
      var aA=dt[i+3];
      if(aA>120){
        var rA=dt[i],gA=dt[i+1],bA=dt[i+2];
        if(rA>240&&gA>240&&bA>240) continue;
        var ppx=(i/4)%tw,ppy=Math.floor((i/4)/tw);
        pts.push([ppx,ppy,rA,gA,bA]);
      }
    }
    // shuffle
    for(var s=pts.length-1;s>0;s--){
      var k=Math.floor(Math.random()*(s+1));
      var t=pts[s]; pts[s]=pts[k]; pts[k]=t;
    }
    var scW=region.w/tw, scH=region.h/th;
    var sc=Math.min(scW,scH);
    var fw=tw*sc, fh=th*sc;
    var ox=region.x+(region.w-fw)/2;
    var oy=region.y+(region.h-fh)/2;
    for(var j=rangeStart;j<rangeEnd;j++){
      var localIdx=j-rangeStart;
      if(localIdx<pts.length){
        var p=pts[localIdx];
        lx[j]=p[0]*sc+ox;
        ly[j]=p[1]*sc+oy;
        if(defaultColor){
          lcolor[j]=defaultColor;
        } else {
          lcolor[j]='rgba('+p[2]+','+p[3]+','+p[4]+',0.92)';
        }
      } else {
        var a=Math.random()*Math.PI*2;
        var rd=Math.random()*300+700;
        lx[j]=CX+Math.cos(a)*rd;
        ly[j]=CY+Math.sin(a)*rd;
        lcolor[j]='rgba(180,180,185,0)';
      }
    }
  }

  // Posiciones: Sener a la izquierda, ETS a la derecha (30% mayor)
  var senerRegion={x:CX-300,y:CY-30,w:260,h:60};
  var etsRegion={x:CX+40,y:CY-91,w:234,h:182};
  // Reparto de partículas
  var senerCount=2200, etsCount=N-senerCount;

  var senerImg=new Image();
  senerImg.onload=function(){
    placeTargets(0,senerCount,senerImg,senerRegion,'rgba(13,31,92,0.92)');
    loaded.sener=true; tryReady();
  };

    placeTargets(senerCount,N,etsImg,etsRegion,null);
    loaded.ets=true; tryReady();
  };

  var rotY=0,rotX=0.15;
  var state='sphere',timer=0,mProg=0;
  var SDUR=150,MDUR=58;

  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

  function project(x3,y3,z3){
    // rotate Y
    var cosY=Math.cos(rotY),sinY=Math.sin(rotY);
    var rx=x3*cosY+z3*sinY;
    var rz=-x3*sinY+z3*cosY;
    // rotate X
    var cosX=Math.cos(rotX),sinX=Math.sin(rotX);
    var ry=y3*cosX-rz*sinX;
    return {x:CX+rx, y:CY+ry, z:rz};
  }

  function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,W,H);

    timer++;

    if(state==='sphere'){
      rotY+=0.012;
      for(var i=0;i<N;i++){
        var p=project(s3x[i],s3y[i],s3z[i]);
        px[i]=p.x; py[i]=p.y;
      }
      if(logoLoaded&&timer>SDUR){
        state='morphToLogo';mProg=0;
        for(var i=0;i<N;i++){fx[i]=px[i];fy[i]=py[i];}
        timer=0;
      }
    } else if(state==='logo'){
      if(timer>SDUR){
        state='morphToSphere';mProg=0;
        for(var i=0;i<N;i++){fx[i]=px[i];fy[i]=py[i];}
        timer=0;
      }
    } else if(state==='morphToLogo'||state==='morphToSphere'){
      mProg++;
      var t=ease(Math.min(mProg/MDUR,1));
      var tx2=state==='morphToLogo'?lx:null;
      var ty2=state==='morphToLogo'?ly:null;
      if(state==='morphToSphere'){
        rotY+=0.010;
        for(var i=0;i<N;i++){
          var p=project(s3x[i],s3y[i],s3z[i]);
          tx2=p.x; ty2=p.y;
          px[i]=fx[i]+(tx2-fx[i])*t;
          py[i]=fy[i]+(ty2-fy[i])*t;
        }
      } else {
        for(var i=0;i<N;i++){
          px[i]=fx[i]+(lx[i]-fx[i])*t;
          py[i]=fy[i]+(ly[i]-fy[i])*t;
        }
      }
      if(mProg>=MDUR){state=state==='morphToLogo'?'logo':'sphere';timer=0;}
    }

    // Dibujar
    var useLogo = (state==='logo') || (state==='morphToLogo');
    for(var i=0;i<N;i++){
      ctx.beginPath();
      ctx.arc(px[i],py[i],0.85,0,6.2832);
      if(useLogo && lcolor[i]){
        ctx.fillStyle=lcolor[i];
      } else {
        ctx.fillStyle=pcolor[i];
      }
      ctx.fill();
    }
  }
  animate();
})();
