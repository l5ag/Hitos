<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sener – Línea 5 FMB</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f0f0f2;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Trebuchet MS',Trebuchet,sans-serif;}
  .grid-bg{position:absolute;inset:0;overflow:hidden;z-index:1;}
  .grid-bg::before{content:'';position:absolute;inset:-50%;
    background-image:linear-gradient(rgba(150,150,160,0.18) 1px,transparent 1px),linear-gradient(90deg,rgba(150,150,160,0.18) 1px,transparent 1px);
    background-size:50px 50px;animation:gridmove 12s linear infinite;}
  @keyframes gridmove{from{transform:translate(0,0);}to{transform:translate(50px,50px);}}
  .halo{position:absolute;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,38,100,0.10) 0%,transparent 70%);
    top:38%;left:50%;transform:translate(-50%,-50%);
    animation:gpulse 3s ease-in-out infinite;z-index:2;}
  @keyframes gpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5;}50%{transform:translate(-50%,-50%) scale(1.25);opacity:1;}}
  #pc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.4);z-index:3;}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:72px;text-align:center;z-index:4;pointer-events:none;}
  .eyebrow{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#4d7cc7;margin-bottom:14px;opacity:0;animation:gfade 1s 0.8s forwards;}
  .title{font-size:62px;font-weight:700;color:#464646;margin-bottom:10px;opacity:0;animation:gfade 1s 1.1s forwards;line-height:1.1;}
  .title span{color:#0d1f5c;}
  .btn-group{display:flex;flex-direction:column;gap:8px;margin-top:1.4rem;opacity:0;animation:gfade 1s 1.8s forwards;}
  .btn-row{display:flex;gap:10px;justify-content:center;}
  .btn-item{padding:10px 0;border-radius:4px;font-size:14px;border:1px solid rgba(13,31,92,.6);color:#0d1f5c;background:rgba(13,31,92,.10);width:170px;text-align:center;cursor:pointer;transition:all 0.25s ease;pointer-events:all;text-decoration:none;display:inline-block;}
  .btn-item:hover{background:rgba(13,31,92,.22);box-shadow:0 4px 18px rgba(13,31,92,.35);transform:translateY(-2px);border-color:rgba(13,31,92,.9);}
  @keyframes gfade{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body style="background:#f0f0f2;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
<div style="width:100vw;height:100vh;position:relative;overflow:hidden;">
  <div class="grid-bg"></div>
  <div class="halo"></div>
  <canvas id="pc" width="1280" height="720"></canvas>

<script>
(function(){
  var canvas=document.getElementById('pc');
  var ctx=canvas.getContext('2d');
  var W=1280,H=720;
  var N=6000;
  var CX=W/2, CY=H*0.30, R=130;

  // 3D coords para la esfera
  var s3x=new Float32Array(N),s3y=new Float32Array(N),s3z=new Float32Array(N);
  // 2D targets logo
  var lx=new Float32Array(N),ly=new Float32Array(N);
  // posiciones actuales 2D
  var px=new Float32Array(N),py=new Float32Array(N);
  // posiciones morph from
  var fx=new Float32Array(N),fy=new Float32Array(N);

  // Colores
  var pcolor=[];

  // Generar esfera: solo capa externa (entre 75% y 100% del radio)
  for(var i=0;i<N;i++){
    var u=Math.random(),v=Math.random();
    var phi=Math.acos(2*v-1);
    var theta=2*Math.PI*u;
    var r=R*(0.9125+Math.random()*0.0875);
    s3x[i]=r*Math.sin(phi)*Math.cos(theta)+(Math.random()-.5)*4;
    s3y[i]=r*Math.sin(phi)*Math.sin(theta)+(Math.random()-.5)*4;
    s3z[i]=r*Math.cos(phi)+(Math.random()-.5)*4;
    var d=(s3z[i]/R+1)/2;
    var r2=Math.round(13+d*15);
    var g2=Math.round(31+d*25);
    var b2=Math.round(92+d*70);
    pcolor.push('rgba('+r2+','+g2+','+b2+',0.8)');
    // init posicion
    px[i]=CX+s3x[i];
    py[i]=CY+s3y[i];
  }

  // Scatter logo targets (se llenarán cuando cargue la imagen)
  var logoLoaded=false;
  var img=new Image();
  img.onload=function(){
    var tc=document.createElement('canvas');
    var tw=500,th=Math.round(img.naturalHeight*(tw/img.naturalWidth));
    tc.width=tw;tc.height=th;
    var tx=tc.getContext('2d');
    tx.drawImage(img,0,0,tw,th);
    var data=tx.getImageData(0,0,tw,th).data;
    var pts=[];
    for(var i=0;i<data.length;i+=4){
      if(data[i+3]>100&&data[i+2]>80&&data[i]<120&&data[i]<data[i+2]){
        var ppx=(i/4)%tw,ppy=Math.floor((i/4)/tw);
        if(Math.random()<0.25) pts.push([ppx,ppy]);
      }
    }
    var sc=420/tw;
    var ox=CX-tw*sc/2,oy=CY-th*sc/2-10;
    for(var j=0;j<N;j++){
      if(j<pts.length){lx[j]=pts[j][0]*sc+ox;ly[j]=pts[j][1]*sc+oy;}
      else{
        // dispersar fuera del canvas para que no sean visibles
        var a=Math.random()*Math.PI*2;
        var rd=Math.random()*300+700;
        lx[j]=CX+Math.cos(a)*rd;
        ly[j]=CY+Math.sin(a)*rd;
      }
    }
    logoLoaded=true;
  };

  var rotY=0,rotX=0.15;
  var state='sphere',timer=0,mProg=0;
  var SDUR=150,MDUR=58;

  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

  function project(x3,y3,z3){
    // rotate Y
    var cosY=Math.cos(rotY),sinY=Math.sin(rotY);
    var rx=x3*cosY+z3*sinY;
    var rz=-x3*sinY+z3*cosY;
    // rotate X
    var cosX=Math.cos(rotX),sinX=Math.sin(rotX);
    var ry=y3*cosX-rz*sinX;
    return {x:CX+rx, y:CY+ry, z:rz};
  }

  function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,W,H);

    timer++;

    if(state==='sphere'){
      rotY+=0.012;
      for(var i=0;i<N;i++){
        var p=project(s3x[i],s3y[i],s3z[i]);
        px[i]=p.x; py[i]=p.y;
      }
      if(logoLoaded&&timer>SDUR){
        state='morphToLogo';mProg=0;
        for(var i=0;i<N;i++){fx[i]=px[i];fy[i]=py[i];}
        timer=0;
      }
    } else if(state==='logo'){
      if(timer>SDUR){
        state='morphToSphere';mProg=0;
        for(var i=0;i<N;i++){fx[i]=px[i];fy[i]=py[i];}
        timer=0;
      }
    } else if(state==='morphToLogo'||state==='morphToSphere'){
      mProg++;
      var t=ease(Math.min(mProg/MDUR,1));
      var tx2=state==='morphToLogo'?lx:null;
      var ty2=state==='morphToLogo'?ly:null;
      if(state==='morphToSphere'){
        rotY+=0.010;
        for(var i=0;i<N;i++){
          var p=project(s3x[i],s3y[i],s3z[i]);
          tx2=p.x; ty2=p.y;
          px[i]=fx[i]+(tx2-fx[i])*t;
          py[i]=fy[i]+(ty2-fy[i])*t;
        }
      } else {
        for(var i=0;i<N;i++){
          px[i]=fx[i]+(lx[i]-fx[i])*t;
          py[i]=fy[i]+(ly[i]-fy[i])*t;
        }
      }
      if(mProg>=MDUR){state=state==='morphToLogo'?'logo':'sphere';timer=0;}
    }

    // Dibujar
    for(var i=0;i<N;i++){
      ctx.beginPath();
      ctx.arc(px[i],py[i],0.85,0,6.2832);
      ctx.fillStyle=pcolor[i];
      ctx.fill();
    }
  }
  animate();

  // Hover botones
  var btns=document.querySelectorAll('.btn-item');
  btns.forEach(function(b){
    b.addEventListener('mouseenter',function(){btns.forEach(function(x){if(x!==b)x.style.opacity='0.3';});});
    b.addEventListener('mouseleave',function(){btns.forEach(function(x){x.style.opacity='1';});});
  });
})();
</script>
